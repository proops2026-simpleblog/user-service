name: CI
# IRD-011 pipeline (reference: content-service @ 40c914f) + a sonar job (DOP-006 change pending).
on:
  pull_request:              # PR checks test the merge result; required by "Protect main"
  push:
    branches: [main]         # post-merge run; unfiltered push + pull_request = 2 runs per commit
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # a new PR push cancels the superseded run; main runs (deploys) always finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # lint and test have no needs: between them, so they run in parallel.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint   # eslint . --max-warnings 0

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    # Throwaway Postgres for the integration tests (tests/setup.js migrates real tables).
    # Matches docker-compose: postgres:16-alpine. Trust auth = no credential to hardcode;
    # the container only lives for this job and is reachable only from this runner.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: user_db
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres@localhost:5432/user_db
      INITIAL_ADMIN_EMAIL: admin@ci.local

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'   # same as Dockerfile node:20-alpine (IRD-006), not the laptop's Node
          cache: 'npm'
      # No stored secret (DOP-006 AC-6) and no credential-shaped literal in YAML: fresh random
      # values per run, masked before they reach $GITHUB_ENV so every later log shows ***.
      - name: Generate per-run test secrets
        run: |
          for name in JWT_SECRET INITIAL_ADMIN_PASSWORD; do
            value=$(openssl rand -hex 24)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - run: npm ci
      - run: npm run migrate
      - run: npm run test:coverage   # jest --coverage → coverage/lcov.info
      # Hand the report to the sonar job; the scanner reads coverage, it never runs tests.
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 1

  sonar:
    # Skipped until Sonar is configured (Day 26): org variable SONAR_HOST_URL (+ SONAR_ORGANIZATION
    # for SonarCloud) and org secret SONAR_TOKEN. Fork PRs get no secrets, so they skip too.
    if: >-
      vars.SONAR_HOST_URL != '' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [test]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0       # full history: blame + "new code" detection
      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage
      - uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          # qualitygate.wait: a failed Quality Gate fails this job, so it can gate the merge
          args: >-
            -Dsonar.qualitygate.wait=true
            ${{ vars.SONAR_ORGANIZATION && format('-Dsonar.organization={0}', vars.SONAR_ORGANIZATION) || '' }}

  build-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [lint, test]
    permissions:
      contents: read
      packages: write          # only this job can push to GHCR
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        # IRD-006: tag = 7-char commit SHA, never latest.
        # On pull_request GITHUB_SHA is GitHub's temporary merge commit, so that image
        # is never pushed: GHCR only ever holds tags that are real commits on main.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # Third-party actions pinned to full commit SHA (tags can be re-pointed)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          # PR: write the image to a tarball instead, handed to deploy as an artifact
          outputs: ${{ github.event_name == 'pull_request' && format('type=docker,dest={0}/image.tar', runner.temp) || '' }}
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build-image]
    permissions:
      contents: read
      packages: read           # pull the image from GHCR inside kind
    defaults:
      run:
        shell: bash            # -eo pipefail (plain run: is bash -e only)
    env:
      IMAGE: ${{ needs.build-image.outputs.image }}
      NS: blogcms
    steps:
      # Manifests live in the docs repo (IRD-007), not here.
      - uses: actions/checkout@v7
        with:
          repository: proops2026-simpleblog/docs
          path: docs

      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: ci-${{ github.run_id }}
          wait: 120s

      - name: Create Secrets (random values, cluster dies with the job)
        run: bash docs/k8s/create-secrets.sh   # committed as 100644 (no +x) in docs

      - name: Load the PR image into kind (never pushed)
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v8
        with:
          name: image
          path: ${{ runner.temp }}
      - if: github.event_name == 'pull_request'
        run: kind load image-archive "$RUNNER_TEMP/image.tar" --name "ci-$GITHUB_RUN_ID"

      - name: Let the cluster pull from GHCR
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kubectl create secret docker-registry ghcr-pull -n "$NS" \
            --docker-server=ghcr.io --docker-username="$GITHUB_ACTOR" \
            --docker-password="$GHCR_TOKEN" --dry-run=client -o yaml | kubectl apply -f -
          kubectl patch serviceaccount default -n "$NS" \
            -p '{"imagePullSecrets":[{"name":"ghcr-pull"}]}'

      # CI overlay = base + this commit's image, same shape as overlays/eks.
      # Only postgres + user-service run; the other apps are removed.
      - name: Build CI overlay
        run: |
          mkdir -p docs/k8s/overlays/ci
          cat > docs/k8s/overlays/ci/kustomization.yaml <<YAML
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - ../../base
          images:
            - name: user-service
              newName: ${IMAGE%:*}
              newTag: "${IMAGE##*:}"
          patches:
            - target: { kind: Deployment, name: user-service }
              patch: |-
                - op: replace
                  path: /spec/template/spec/containers/0/imagePullPolicy
                  value: IfNotPresent
            - target: { kind: Deployment, name: (content-service|gateway|frontend) }
              patch: |-
                \$patch: delete
                apiVersion: apps/v1
                kind: Deployment
                metadata: { name: unused }
          YAML
          kubectl kustomize docs/k8s/overlays/ci | grep -E '^kind: Deployment|image:'

      - name: Apply manifests
        run: kubectl apply -k docs/k8s/overlays/ci

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/postgres -n "$NS" --timeout=120s
          kubectl rollout status deployment/user-service -n "$NS" --timeout=180s

      - name: Show running image (evidence)
        run: |
          kubectl get pods -n "$NS" -o wide
          kubectl describe pod -n "$NS" -l app=user-service | grep -E '^Name:|Image:|Status:'
          kubectl get pods -n "$NS" -l app=user-service \
            -o jsonpath='{range .items[*]}{.spec.containers[0].image}{"\n"}{end}' | grep -qx "$IMAGE"

      - name: Diagnose (only on failure)
        if: failure()
        run: |
          kubectl get pods,events -n "$NS" --sort-by=.lastTimestamp || true
          kubectl describe pod -n "$NS" -l app=user-service || true
          kubectl logs -n "$NS" -l app=user-service --all-containers --tail=50 || true
