name: IaC PR Open — Plan
on:
  pull_request:
    branches: [main]
    paths: ['iac/**']
permissions: { contents: read, id-token: write }
jobs:
  ci:
    uses: proops2026-simpleblog/proops2026-cicd-platform/.github/workflows/reusable-iac.yml@feature/dat/platform-v1.2
    with:
      action: plan
      environment: dev
      working-directory: iac/dev
      aws-region: us-east-2
      aws-role-arn: ${{ vars.AWS_PLAN_ROLE_ARN }}
      backend-bucket: ${{ vars.TFSTATE_BUCKET }}
      terraform-version: "~1.16"
    secrets: inherit # TF_VAR_OWNER, TF_VAR_EMAIL, TF_VAR_RESPONSIBLE_PARTY
