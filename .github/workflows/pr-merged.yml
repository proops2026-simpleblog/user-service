name: PR Merged — App CI + Push
on: { push: { branches: [main], paths-ignore: ['iac/**'] }, workflow_dispatch: {} }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: false }
permissions: { contents: read, packages: write }
jobs:
  ci:
    uses: proops2026-simpleblog/proops2026-cicd-platform/.github/workflows/reusable-app-ci.yml@v1.2
    with:
      image-name: proops2026-simpleblog/user-service
      push-image: true
      test-script: test:coverage
      db-name: user_db
      test-secrets: JWT_SECRET INITIAL_ADMIN_PASSWORD
      test-env: INITIAL_ADMIN_EMAIL=admin@ci.local
      deploy-kind: true
      service-name: user-service
      run-sonar: false # SonarCloud project blocked on org permission (Day 26)
