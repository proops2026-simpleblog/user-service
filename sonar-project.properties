# Sonar analysis scope for user-service. No host URL or token here (public repo):
# the server comes from SONAR_HOST_URL and the token from SONAR_TOKEN.
sonar.projectKey=proops2026-simpleblog_user-service
sonar.projectName=user-service

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Produced by `npm run test:coverage`; the scanner does not run the tests.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
